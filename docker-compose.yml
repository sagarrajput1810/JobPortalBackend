services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - jobportal-network

  auth-service:
    build:
      context: ./JobPortal.AuthService
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "5063:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__Host=rabbitmq
      - ServiceBus__ConnectionString=${SERVICE_BUS_CONNECTION_STRING}
    depends_on:
      - rabbitmq
    networks:
      - jobportal-network

  job-service:
    build:
      context: ./JobPortal.JobService
      dockerfile: Dockerfile
    container_name: job-service
    ports:
      - "5284:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__Host=rabbitmq
      - ServiceBus__ConnectionString=${SERVICE_BUS_CONNECTION_STRING}
    depends_on:
      - rabbitmq
    networks:
      - jobportal-network

  profile-service:
    build:
      context: ./JobPortal.ProfileService
      dockerfile: Dockerfile
    container_name: profile-service
    ports:
      - "5129:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__Host=rabbitmq
      - ServiceBus__ConnectionString=${SERVICE_BUS_CONNECTION_STRING}
    depends_on:
      - rabbitmq
    networks:
      - jobportal-network

  search-service:
    build:
      context: ./JobPortal.SearchService
      dockerfile: Dockerfile
    container_name: search-service
    ports:
      - "5252:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__Host=rabbitmq
      - ServiceBus__ConnectionString=${SERVICE_BUS_CONNECTION_STRING}
    depends_on:
      - rabbitmq
    networks:
      - jobportal-network

  application-service:
    build:
      context: ./JobPortal.ApplicationService
      dockerfile: Dockerfile
    container_name: application-service
    ports:
      - "5243:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__Host=rabbitmq
      - ServiceBus__ConnectionString=${SERVICE_BUS_CONNECTION_STRING}
    depends_on:
      - rabbitmq
    networks:
      - jobportal-network

  notification-service:
    build:
      context: ./JobPortal.NotificationService
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "5295:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__Host=rabbitmq
      - ServiceBus__ConnectionString=${SERVICE_BUS_CONNECTION_STRING}
    depends_on:
      - rabbitmq
    networks:
      - jobportal-network

  ai-resume-parser-service:
    build:
      context: ./JobPortal.AIResumeParserService
      dockerfile: Dockerfile
    container_name: ai-resume-parser-service
    ports:
      - "5241:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMq__Host=rabbitmq
      - ServiceBus__ConnectionString=${SERVICE_BUS_CONNECTION_STRING}
      - ServiceUrls__ApplicationService=http://application-service:8080
    depends_on:
      - rabbitmq
    networks:
      - jobportal-network

  gateway-service:
    build:
      context: ./JobPortal.GatewayService
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "5046:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - auth-service
      - job-service
      - profile-service
      - search-service
      - application-service
    networks:
      - jobportal-network

  frontend:
    build:
      context: ../JobPortalFrontend
      dockerfile: Dockerfile
    container_name: jobportal-frontend
    ports:
      - "4000:4000"
    networks:
      - jobportal-network

networks:
  jobportal-network:
    driver: bridge
